[project]
name = "valet-sim"
version = "0.1.0"
description = "A MuJoCo SO-101 with a box to pick and place: the shared testbed for valet's control experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.3",
    "numpy>=2",
    "pillow>=11",
]

[project.scripts]
valet-sim = "valet_sim.server:main"

[project.optional-dependencies]
tag = [
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
