[project]
name = "physical-agent"
version = "0.1.0"
description = "Claude drives the simulated SO-101 only through absolute end-effector sequence tool calls (the Physical Agent interface) on the valet-sim benchmark."
requires-python = ">=3.12"
dependencies = [
    "valet-sim",
    "anthropic>=2.11",
    "numpy>=2",
    "pillow>=11",
]

[project.scripts]
physical-agent = "physical_agent.run:main"

[tool.uv.sources]
valet-sim = { path = "../../sim", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physical_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
