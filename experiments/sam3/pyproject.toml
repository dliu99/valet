[project]
name = "sam3-perception"
version = "0.1.0"
description = "SAM 3 (open-vocabulary segmentation) on the wrist camera: masks back-projected to the table, IK reaches."
requires-python = ">=3.12"
dependencies = [
    "valet-sim",
    "httpx>=0.27",
    "numpy>=2",
    "pillow>=11",
    "scipy>=1.13",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
sam = ["mlx-vlm>=0.4.3"]

[tool.uv.sources]
valet-sim = { path = "../../sim", editable = true }

[tool.uv]
package = false
