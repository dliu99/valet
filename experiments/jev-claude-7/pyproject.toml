[project]
name = "jev-claude-7"
version = "0.1.0"
description = "valet-sim pick-and-place: Jev sees and checks, Claude plans and learns from its own episodes."
requires-python = ">=3.12"
dependencies = [
    "valet-sim",
    "typesafe-sdk>=0.7.5",
    "anthropic>=2.11",
]

[tool.uv.sources]
valet-sim = { path = "../../sim", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jc7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
