# Copy to valet.toml (git-ignored) and fill in for your arm. One file for armd and the brain.
# Lengths in metres, angles in degrees.

[armd]
url = "http://127.0.0.1:8750"
port = "/dev/tty.usbmodem5B901520711"   # `lerobot-find-port`
robot_id = "valet_follower"             # the id you calibrated under (`lerobot-calibrate`)
allow_motion = false                    # true lets /act move the arm; false answers 403
table_z = 0.0                           # measured by touching the table
speed_dps = 25

[cameras]                               # files camfeed.py keeps fresh
wrist = "runs/live/wrist.jpg"
side = "runs/live/side.jpg"
wrist_view = "on the gripper, looking along the jaws"
side_view = "fixed, beside the table"

[servo]                                 # image-space servoing for `center`
kx_deg = 80.0
ky_m = 0.32
window = { center_x = 0.47, center_y = 0.62, width = 0.08, height = 0.12 }

[decider]                               # who picks each move
kind = "jev"                            # jev (TYPESAFE_API_KEY) | h2o | chat | fake
base_url = ""                           # empty: the provider default; h2o: http://127.0.0.1:8741/v1
# model = "jev-latest"                  # the System One model; h2o: h2o-lightning-4b
# chat = "anthropic/claude-opus-5-5"    # kind = "chat": any pi-ai chat model with images, as a benchmark

[planner]                               # who writes the cards: any pi-ai chat model with tools and images
provider = "anthropic"                  # ANTHROPIC_API_KEY
model = "claude-opus-5-5"

[ui]
port = 8760
