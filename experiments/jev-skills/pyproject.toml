[project]
name = "jev-skills"
version = "0.1.0"
description = "Jev picks among closed-loop skills on valet-sim; each skill has a done criterion Jev judges."
requires-python = ">=3.12"
dependencies = [
    "valet-sim",
    "numpy>=2",
    "pillow>=11",
    "httpx>=0.27",
    "anthropic>=0.70",
]

[tool.uv.sources]
valet-sim = { path = "../../sim", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
