[project]
name = "apriltag-exp"
version = "0.1.0"
description = "Does a table AprilTag help the wrist camera localize and reach? An experiment on valet-sim."
requires-python = ">=3.12"
dependencies = [
    "valet-sim[tag]",
    "scipy>=1.14",
]

[tool.uv.sources]
valet-sim = { path = "../../sim", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apriltag_exp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
