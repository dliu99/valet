[project]
name = "claude-policy"
version = "0.1.0"
description = "Claude runs the simulated SO-101 with three tools (look, move, gripper) on the valet-sim pick-and-place benchmark."
requires-python = ">=3.12"
dependencies = [
    "valet-sim",
    "anthropic>=2.11",
    "typesafe-sdk>=0.7.5",
    "numpy>=2",
    "pillow>=11",
]

[project.scripts]
claude-policy = "claude_policy.run:main"

[tool.uv.sources]
valet-sim = { path = "../../sim", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
